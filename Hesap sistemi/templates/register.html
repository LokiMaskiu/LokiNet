<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <title>Kayıt Ol</title>

    <style>

        body{
            background:#1e1e1e;
            color:white;
            font-family:Arial;
        }

        .kutu{
            width:350px;
            background:#2d2d2d;
            margin:100px auto;
            padding:40px;
            border-radius:15px;
            text-align:center;
            box-shadow:0px 0px 15px black;
        }

        input{
            width:90%;
            padding:12px;
            margin-top:10px;
            border:none;
            border-radius:10px;
        }

        button{
            width:95%;
            padding:12px;
            margin-top:20px;
            background:#2196F3;
            color:white;
            border:none;
            border-radius:10px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#1976D2;
        }

        a{
            color:#4CAF50;
        }

    </style>

</head>

<body>

    <div class="kutu">

        <h1>Kayıt Ol</h1>

        <form action="/register" method="POST">

            <input
                type="text"
                name="kullanici"
                placeholder="Kullanıcı Adı"
            >

            <input
                type="password"
                name="sifre"
                placeholder="Şifre"
            >

            <button type="submit">
                Kayıt Ol
            </button>

        </form>

        <p>{{ hata }}</p>

        <br>

        <a href="/login">
            Zaten hesabın var mı?
        </a>

    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<title>Login</title>

<link rel="icon" href="/static/favicon.ico">

<style>

body{
    background:#121212;
    font-family:Arial;
    color:white;
}

.kutu{
    width:350px;
    margin:100px auto;
    background:#1f1f1f;
    padding:40px;
    border-radius:15px;
    text-align:center;
    box-shadow:0px 0px 15px black;
}

input{
    width:90%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    outline:none;
}

button{
    width:95%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    background:#4CAF50;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#45a049;
}

a{
    color:#4CAF50;
    text-decoration:none;
}

a:hover{
    text-decoration:underline;
}

/* 🔥 HATA */
.error{
    color:#ff4d4d;
    margin-top:12px;
    font-size:14px;
}

</style>

</head>

<body>

<div class="kutu">

<h1>Giriş Yap</h1>

<!-- ✔ BACKEND UYUMLU -->
<form action="/login" method="POST">

    <input
        type="text"
        name="username"
        placeholder="Kullanıcı Adı"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Şifre"
        required
    >

    <button type="submit">
        Giriş Yap
    </button>

</form>

<!-- 🔥 HATA MESAJI -->
{% if hata %}
    <div class="error">
        {{ hata }}
    </div>
{% endif %}

<br>

<a href="/register">Kayıt Ol</a>

</div>

</body>

</html>
